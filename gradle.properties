# JVM args — keep heap reasonable for 8GB build machine
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g --enable-native-access=ALL-UNNAMED

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official

# Kotlin compile daemon — ОТДЕЛЬНЫЙ процесс, связан с Gradle-демоном по RMI.
# Без явного -Xmx он наследовал 4g Gradle-демона → 4+4=8g на 8GB-машине →
# демон убивался по памяти → «w: Unable to release compile session … Connection reset».
# (Само предупреждение безвредно: компиляция к этому моменту уже завершилась, APK валиден.)
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
# План Б, если предупреждение начнёт повторяться даже с этим: компилировать внутри
# Gradle-демона, без отдельного Kotlin-демона (инкрементальные сборки медленнее):
# kotlin.compiler.execution.strategy=in-process

# Non-transitive R classes — smaller R
android.nonTransitiveRClass=true

# Compose
# android.defaults.buildfeatures.buildconfig — REMOVED в AGP 9.0
# (использовать buildFeatures { buildConfig = true } в app/build.gradle.kts)
# android.nonFinalResIds — убрано, дефолт true (AGP 10.0 удалит опцию)

# Performance
org.gradle.caching=true
org.gradle.parallel=true
# org.gradle.configuration-cache — ОТКЛЮЧЁН: вызывает «Edit Configuration»
# при Gradle Sync в Android Studio с AGP 9.x (конфликт model caching).
# Можно включить позже, когда стабилизируется.
org.gradle.daemon=true

# Suppress unsupported compileSdk warning (we use preview 36)
android.suppressUnsupportedCompileSdk=36
