[versions]
agp = "9.1.1"
kotlin = "2.4.0"
coreKtx = "1.17.0"
# #ARCH-CONTAINERS (Этап 1.2-в): @RequiresApi в VideoPipController (:core:media).
androidxAnnotation = "1.9.1"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2025.06.00"
navigationCompose = "2.9.4"
fragment = "1.8.8"
datastore = "1.1.7"
securityCrypto = "1.1.0-beta01"
biometric = "1.4.0-alpha02"
okhttp = "4.12.0"
coil = "3.3.0"
gson = "2.13.1"
kotlinxCoroutines = "1.10.2"
webkit = "1.14.0"
browser = "1.9.0"
media3 = "1.8.0"
documentfile = "1.1.0"
splashscreen = "1.2.0-rc01"
# §37.12 Phase 5: CameraX для записи клипов (ClipCreateScreen).
# Stable 1.4.2 на 2025-01. minSdk=24 совместим.
camerax = "1.4.2"
# #SESSION-COOKIES-BG-REFRESH: WorkManager для periodic cookie sync (каждые 6ч)
# + lifecycle-process для ProcessLifecycleOwner (app foreground detection).
# 2.10.2 — stable на 2025-01, совместим с lifecycle 2.9.4.
work = "2.10.2"
# §42.12 P0 #2: ffmpeg-kit для Siren→AAC транскодера.
# ВНИМАНИЕ: arthenica ЗАКРЫЛА ffmpeg-kit в 2024 и УДАЛИЛА все бинарники
# (ffmpeg-kit-*) с Maven Central — остались только smart-exception-* хелперы.
# Используем community fork VineshChauhan24/ffmpeg-kit-android-16kb-lts-full-gpl:
#   - 16KB page-aligned (обязательно для Android 15+ / API 35+, PinoK targetSdk=36)
#   - NDK r27d, ffmpeg 6.0, Full-GPL (все кодеки включая g7221/siren)
#   - JitPack build status: ok (v1.0.7)
#   - Пакет com.arthenica.ffmpegkit сохранён — SirenTranscoder.kt БЕЗ правок.
# Минус: full-gpl (~30-40 MB) вместо audio-only (~15-20 MB). Можно ужать
# через splits.abi если размер станет критичным (см. build.gradle.kts).
ffmpegKit = "1.0.7"
# #CALLS: WebRTC — поддерживаемая Android-сборка от Stream (org.webrtc.* API).
webrtc = "1.3.10"

[libraries]
# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# #ARCH-CONTAINERS (Этап 1.2-в): androidx.annotation для :core:media (VideoPipController).
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# #SESSION-COOKIES-BG-REFRESH: ProcessLifecycleOwner — app foreground/background
# events. Используется в SovaApp для cookie sync на ON_RESUME.
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

# Fragment (for BiometricPrompt which requires FragmentActivity)
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Security / EncryptedSharedPreferences
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Biometric
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# WebKit (for OAuth WebView)
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

# Browser (for Chrome Custom Tabs — OAuth redirect bypass)
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

# Splash screen
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# DocumentFile (for downloads)
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

# OkHttp
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Coil (image loading)
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
# Fix #229: декодеры анимированных стикеров (GIF + animated WebP).
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }

# Gson
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Media3 (ExoPlayer replacement)
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
androidx-media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }
# Fix #68: HLS-модуль нужен для воспроизведения VK audio (now 100% HLS .m3u8) и video.
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }

# §42.12 P0 #2: ffmpeg-kit (VineshChauhan24 fork) — Siren→AAC транскодер.
# 16KB page-aligned build для Android 15+ (API 35+). Full-GPL = все кодеки
# включая g7221/siren декодер. Пакет com.arthenica.ffmpegkit (форк сохраняет
# оригинальный package — SirenTranscoder.kt работает без правок).
# Размер: ~30-40 MB native libs (arm64-v8a + armeabi-v7a + x86_64 + x86).
# Зависимость smart-exception-java:0.2.1 тянется транзитивно с Maven Central.
# Имя accessor'а оставлено `ffmpeg.kit.audio` для back-compat с build.gradle.kts.
ffmpeg-kit-audio = { group = "com.github.VineshChauhan24", name = "ffmpeg-kit-android-16kb-lts-full-gpl", version.ref = "ffmpegKit" }

# §37.12 Phase 5: CameraX для записи клипов
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }

# #SESSION-COOKIES-BG-REFRESH: WorkManager — periodic background cookie sync
# (CookieRefreshWorker, каждые 6ч). Ловит ротэйты cookies пока app в фоне.
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# #CALLS: WebRTC (org.webrtc.* API) от Stream.
webrtc = { group = "io.getstream", name = "stream-webrtc-android", version.ref = "webrtc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# #ARCH-CONTAINERS (Этап 1.1): модуль :contracts — Android-библиотека.
android-library = { id = "com.android.library", version.ref = "agp" }
# kotlin-android — НЕ применяется (AGP 9+ применяет автоматически),
# но IDE нужна декларация в каталоге для model resolution.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
